
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Expects PostgreSQL on localhost:5432.
# Start it with: docker compose -f docker-compose.postgres.yml up -d postgres

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/irp}
spring.datasource.username=${POSTGRES_USER:irp}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.flyway.enabled=true
