spring.application.name=irp-portal
server.port=8080
server.error.include-message=always
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:irp;DB_CLOSE_DELAY=-1}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Parameterized environment settings (overridden by environment variables in Jenkins / Docker / Ansible)
app.environment=${APP_ENVIRONMENT:local}
app.version=${APP_VERSION:dev}
app.demo-defect=${APP_DEMO_DEFECT:false}
